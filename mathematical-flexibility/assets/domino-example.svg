<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" role="img" aria-labelledby="title desc"><title id="title">Visual-symbolic fraction equivalence</title><desc id="desc">One half shaded rectangle equals two quarters. New illustration of a documented rule.</desc><rect width="100%" height="100%" fill="white"/><text x="20" y="28" font-family="system-ui, sans-serif" font-size="19" fill="#152e41" font-weight="650">Dominó Fraccionario · connect equivalent quantities</text><rect x="45" y="70" width="210" height="125" rx="8" fill="#f2f7f8"/><rect x="62" y="87" width="87" height="90" rx="0" fill="#146675"/><rect x="149" y="87" width="87" height="90" rx="0" fill="#dfe9ed"/><rect x="62" y="87" width="174" height="90" fill="none" stroke="#163344" stroke-width="2"/><text x="316" y="151" font-family="system-ui, sans-serif" font-size="40" fill="#146675" font-weight="650">=</text><rect x="405" y="70" width="240" height="125" rx="8" fill="#f2f7f8"/><text x="480" y="150" font-family="system-ui, sans-serif" font-size="42" fill="#146675" font-weight="650">2/4</text><text x="72" y="229" font-family="system-ui, sans-serif" font-size="17" fill="#506775" font-weight="400">1 of 2 equal parts</text><text x="437" y="229" font-family="system-ui, sans-serif" font-size="17" fill="#506775" font-weight="400">Equivalent value</text></svg>