<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-labelledby="title desc"><title id="title">Strategy-origin counts in three game sessions</title><desc id="desc">FracciChef: 56 spontaneous, 22 peer, 9 teacher, 3 not observable. Domino: 68,16,4,2. FraccUNO: 64,14,6,6. Each totals 90.</desc><rect width="100%" height="100%" fill="white"/><text x="20" y="30" font-family="system-ui, sans-serif" font-size="21" fill="#152e41" font-weight="650">Strategy origin by game session</text><text x="12" y="93" font-family="system-ui, sans-serif" font-size="14" fill="#152e41" font-weight="400">FracciChef</text><rect x="195" y="70" width="298.6666666666667" height="35" rx="0" fill="#146675"/><text x="337.33333333333337" y="94" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">56</text><rect x="493.6666666666667" y="70" width="117.33333333333333" height="35" rx="0" fill="#6586a0"/><text x="545.3333333333334" y="94" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">22</text><rect x="611.0" y="70" width="48.0" height="35" rx="0" fill="#b87a29"/><text x="628.0" y="94" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">9</text><rect x="659.0" y="70" width="16.0" height="35" rx="0" fill="#e0e4e7"/><text x="12" y="157" font-family="system-ui, sans-serif" font-size="14" fill="#152e41" font-weight="400">Dominó Fraccionario</text><rect x="195" y="134" width="362.66666666666663" height="35" rx="0" fill="#146675"/><text x="369.3333333333333" y="158" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">68</text><rect x="557.6666666666666" y="134" width="85.33333333333334" height="35" rx="0" fill="#6586a0"/><text x="593.3333333333333" y="158" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">16</text><rect x="643.0" y="134" width="21.333333333333336" height="35" rx="0" fill="#b87a29"/><rect x="664.3333333333334" y="134