<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-labelledby="title desc"><title id="title">Two legal FraccUNO moves</title><desc id="desc">A blue half card can be followed by a blue three quarters card or a red two quarters card. Labels distinguish colour matching and equivalent value.</desc><rect width="100%" height="100%" fill="white"/><text x="20" y="28" font-family="system-ui, sans-serif" font-size="19" fill="#152e41" font-weight="650">FraccUNO · choose between legal moves</text><rect x="20" y="72" width="180" height="130" rx="8" fill="#225c9a"/><text x="63" y="150" font-family="system-ui, sans-serif" font-size="40" fill="white" font-weight="650">1/2</text><text x="20" y="231" font-family="system-ui, sans-serif" font-size="17" fill="#506775" font-weight="400">In play</text><rect x="280" y="72" width="180" height="130" rx="8" fill="#225c9a"/><text x="323" y="150" font-family="system-ui, sans-serif" font-size="40" fill="white" font-weight="650">3/4</text><text x="280" y="231" font-family="system-ui, sans-serif" font-size="17" fill="#506775" font-weight="400">Colour match</text><rect x="535" y="72" width="180" height="130" rx="8" fill="#a23e45"/><text x="578" y="150" font-family="system-ui, sans-serif" font-size="40" fill="white" font-weight="650">2/4</text><text x="535" y="231" font-family="system-ui, sans-serif" font-size="17" fill="#506775" font-weight="400">Equivalent value</text><text x="223" y="146" font-family="system-ui, sans-serif" font-size="30" fill="#146675" font-weight="400">→</text><text x="481" y="146" font-family="system-ui, sans-serif" font-size="19" fill="#506775" font-weight="400">or</text></svg>