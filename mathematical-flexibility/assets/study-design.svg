<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" role="img" aria-labelledby="title desc"><title id="title">Five-session single-group study design</title><desc id="desc">Baseline followed by three games and a final session with free play and post-assessment. No control group or delayed follow-up.</desc><rect width="100%" height="100%" fill="white"/><text x="20" y="30" font-family="system-ui, sans-serif" font-size="21" fill="#152e41" font-weight="650">One class. Complementary sources of evidence.</text><rect x="20" y="62" width="720" height="88" rx="5" fill="#f0f5f7"/><rect x="20" y="62" width="5" height="88" rx="0" fill="#166c79"/><text x="40" y="89" font-family="system-ui, sans-serif" font-size="18" fill="#152e41" font-weight="650">S1 / Establish baseline</text><text x="40" y="113" font-family="system-ui, sans-serif" font-size="15" fill="#152e41" font-weight="400">Written questionnaire</text><text x="40" y="134" font-family="system-ui, sans-serif" font-size="14" fill="#516474" font-weight="400">22 pupils; select 15 for follow-up</text><text x="370" y="166" font-family="system-ui, sans-serif" font-size="19" fill="#166c79" font-weight="400">↓</text><rect x="20" y="172" width="720" height="88" rx="5" fill="#f0f5f7"/><rect x="20" y="172" width="5" height="88" rx="0" fill="#166c79"/><text x="40" y="199" font-family="system-ui, sans-serif" font-size="18" fill="#152e41" font-weight="650">S2–S4 / Observe reasoning</text><text x="40" y="223" font-family="system-ui, sans-serif" font-size="15" fill="#152e41" font-weight="400">Three fraction games</text><text x="40" y="244" font-family="system-ui, sans-serif" font-size="14" fill="#516474" font-weight="400">Game-specific rubrics + field notes</text><text x="370" y="276" font-family="system-ui, sans-serif" font-size="19" fill="#166c79" font-weight="400">↓</text><rect x="20" y="282" width="720" height="88" rx="5" fill="#f0f5f7"/><rect x="20" y="282" width="5" height="88" rx="0" fill="#166c79"/><text x="40" y="309" font-family="system-ui, sans-serif" font-size="18" fill="#152e41" font-weight="650">S5 / Assess after the sequence</text><text x="40" y="333" font-family="system-ui, sans-serif" font-size="15" fill="#152e41" font-weight="400">25 min free play + 25 min questionnaire</text><text x="40" y="354" font-family="system-ui, sans-serif" font-size="14" fill="#516474" font-weight="400">15 paired assessment records</text><text x="20" y="420" font-family="system-ui, sans-serif" font-size="14" fill="#516474" font-weight="400">Single-group design · No control group · No delayed follow-up</text></svg>