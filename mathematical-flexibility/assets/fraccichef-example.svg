<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-labelledby="title desc"><title id="title">FracciChef equivalent ingredient combinations</title><desc id="desc">One requirement of two quarters can be met by two quarter cards or one half card.</desc><rect width="100%" height="100%" fill="white"/><text x="20" y="28" font-family="system-ui, sans-serif" font-size="19" fill="#152e41" font-weight="650">FracciChef · one requirement, two valid routes</text><rect x="20" y="54" width="720" height="62" rx="6" fill="#f2f7f8"/><text x="40" y="91" font-family="system-ui, sans-serif" font-size="21" fill="#152e41" font-weight="650">Recipe requires: 2/4 of one ingredient</text><text x="25" y="145" font-family="system-ui, sans-serif" font-size="14" fill="#506775" font-weight="400">Option A</text><rect x="155" y="118" width="565" height="58" rx="6" fill="#f2f7f8"/><text x="180" y="155" font-family="system-ui, sans-serif" font-size="26" fill="#146675" font-weight="650">1/4  +  1/4  =  2/4</text><text x="25" y="231" font-family="system-ui, sans-serif" font-size="14" fill="#506775" font-weight="400">Option B</text><rect x="155" y="204" width="565" height="58" rx="6" fill="#f2f7f8"/><text x="180" y="241" font-family="system-ui, sans-serif" font-size="26" fill="#146675" font-weight="650">1/2  =  2/4</text></svg>